name: Market Basket Project Tests

on:
  push:
    paths:
      - "Recommendation Systems/The Market Basket And Bucket Recommendation System/**"
  pull_request:
    paths:
      - "Recommendation Systems/The Market Basket And Bucket Recommendation System/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Recommendation Systems/The Market Basket And Bucket Recommendation System
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Recommendation Systems/The Market Basket And Bucket Recommendation System/requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: pytest -v
