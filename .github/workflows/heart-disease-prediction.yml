name: Heart Disease Prediction Tests

on:
  push:
    paths:
      - "Machine-Learning/Heart Disease Prediction/**"
      - ".github/workflows/heart-disease-prediction.yml"
  pull_request:
    paths:
      - "Machine-Learning/Heart Disease Prediction/**"
      - ".github/workflows/heart-disease-prediction.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Machine-Learning/Heart Disease Prediction
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Machine-Learning/Heart Disease Prediction/requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
