name: Crypto Market Pipeline Tests

on:
  push:
    paths:
      - "Data-Analytics/Crypto Market Pipeline/version_2/**"
      - ".github/workflows/crypto-market-pipeline-tests.yml"
  pull_request:
    paths:
      - "Data-Analytics/Crypto Market Pipeline/version_2/**"
      - ".github/workflows/crypto-market-pipeline-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Data-Analytics/Crypto Market Pipeline/version_2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Data-Analytics/Crypto Market Pipeline/version_2/requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -v
