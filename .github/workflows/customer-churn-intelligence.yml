name: Customer Churn Intelligence Notebook

on:
  push:
    paths:
      - "Machine-Learning/Customer Churn Intelligence/**"
      - ".github/workflows/customer-churn-intelligence.yml"
  pull_request:
    paths:
      - "Machine-Learning/Customer Churn Intelligence/**"
      - ".github/workflows/customer-churn-intelligence.yml"
  workflow_dispatch:

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Machine-Learning/Customer Churn Intelligence
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Machine-Learning/Customer Churn Intelligence/requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert
      - name: Execute analysis notebook
        run: jupyter nbconvert --to notebook --execute --inplace notebooks/01_data_understanding.ipynb --ExecutePreprocessor.timeout=300
