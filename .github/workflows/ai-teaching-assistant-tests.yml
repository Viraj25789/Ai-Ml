name: AI Teaching Assistant Tests

on:
  push:
    paths:
      - "AI-Projects/AI Teaching Assistant/**"
      - ".github/workflows/ai-teaching-assistant-tests.yml"
  pull_request:
    paths:
      - "AI-Projects/AI Teaching Assistant/**"
      - ".github/workflows/ai-teaching-assistant-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-Projects/AI Teaching Assistant
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "AI-Projects/AI Teaching Assistant/requirements.txt"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        run: python -m pytest -v tests
