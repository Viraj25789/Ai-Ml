
name: Book Price Intelligence Tests

on:
  push:
    paths:
      - "Data-Analytics/Book Price Intelligence/version_4/**"
  pull_request:
    paths:
      - "Data-Analytics/Book Price Intelligence/version_4/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Data-Analytics/Book Price Intelligence/version_4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Data-Analytics/Book Price Intelligence/version_4/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
